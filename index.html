<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>SHADOWBOUND</title>
<style>
:root{color-scheme:dark;--red:#d8262c;--amber:#f0f0f0;--ink:#050506;--paper:#ececec}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);font-family:"Trebuchet MS","Segoe UI","Noto Sans Tamil","Noto Sans Devanagari","Nirmala UI","Latha","Mangal",Arial,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;background:var(--ink)}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:absolute;inset:0;pointer-events:none;color:var(--paper);text-shadow:0 0 3px #000,0 0 10px #000,0 0 22px #000,0 2px 4px #000}
.top{position:absolute;top:max(12px,env(safe-area-inset-top));left:max(16px,env(safe-area-inset-left));right:max(16px,env(safe-area-inset-right));display:flex;align-items:center;gap:14px;font-size:11px;letter-spacing:3px;text-transform:uppercase;opacity:0;transition:opacity .6s}
.playing .top{opacity:1}
.brand{font-weight:900;letter-spacing:4px}.brand span{color:var(--red)}
#act{flex:1;text-align:right;opacity:.7;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hb{pointer-events:auto;width:36px;height:36px;border-radius:50%;border:1px solid #ffffff40;background:#0c0f14b0;color:#fff;font-size:13px;font-weight:700;display:grid;place-items:center;cursor:pointer;padding:0}
.hb.off{opacity:.4;text-decoration:line-through}
#story{position:absolute;top:17%;left:50%;transform:translateX(-50%);width:min(680px,88%);text-align:center;font-size:clamp(13px,2.3vmin,19px);letter-spacing:1.5px;line-height:1.6;opacity:0;transition:opacity .8s;font-style:normal}
#story.on{opacity:.95}
#story.big{font-size:clamp(17px,3.6vmin,30px);letter-spacing:7px;font-weight:800}
#story small{display:block;margin-top:8px;font-size:.72em;letter-spacing:2.5px;color:var(--amber)}
#story i{color:#ff9a9e}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 45%,#07090c66,#07090ce8);pointer-events:auto;padding:16px;overflow:auto}
.panel{width:min(460px,92%);padding:28px 24px 24px;text-align:center;color:var(--paper)}
h1{font-size:clamp(32px,8.5vmin,60px);letter-spacing:9px;margin:0 0 6px;font-weight:900;text-shadow:0 6px 30px #000}
h1 span{color:var(--red);text-shadow:0 0 28px #d8262c99}
.sub{font-size:11px;letter-spacing:4px;color:#b9b8b2;margin:0 0 20px}
.desc{font-size:14px;line-height:1.7;color:#d2d1cb;margin:0 auto 22px;max-width:360px}
.keys{display:block;margin-top:12px;font-size:11.5px;letter-spacing:1px;color:#9c9b95}
.rot{display:none;margin-top:10px;font-size:11px;letter-spacing:1.5px;color:var(--amber)}
.portrait .rot{display:block}
.btn{display:block;margin:10px auto 0;border:1px solid var(--red);background:var(--red);color:#fff;padding:14px 26px;font:inherit;font-weight:800;font-size:13px;letter-spacing:3px;text-transform:uppercase;cursor:pointer;min-width:230px;border-radius:999px;box-shadow:0 8px 30px #d8262c50}
.btn.ghost{background:transparent;color:#e6e5df;border-color:#ffffff55;box-shadow:none}
.btn:active{transform:scale(.97)}
#controls{position:absolute;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));display:none;justify-content:space-between;padding:0 max(18px,env(safe-area-inset-right)) 0 max(18px,env(safe-area-inset-left));pointer-events:none}
.touch.playing #controls{display:flex}
.pad{display:flex;gap:14px;pointer-events:auto;align-items:flex-end}
.ctrl{width:66px;height:66px;border:1.5px solid #ffffff59;border-radius:50%;background:#0c0f14a6;color:#fff;font-size:24px;display:grid;place-items:center;touch-action:none;padding:0;font-family:inherit}
.ctrl.big{width:78px;height:78px}
.ctrl.down{background:#d8262c99;border-color:var(--red)}
.scr{display:none}.scr.on{display:block}
#nameIn{display:block;margin:0 auto 6px;width:min(300px,80%);padding:13px 16px;background:#0b0b0cd0;border:1px solid #ffffff55;border-radius:999px;color:#fff;font:inherit;font-size:16px;letter-spacing:3px;text-align:center;text-transform:uppercase;outline:none;user-select:text;-webkit-user-select:text}
#nameIn:focus{border-color:var(--red);box-shadow:0 0 0 3px #d8262c33}
.lbl{font-size:10.5px;letter-spacing:4px;color:#9a9a9a;margin:0 0 10px}
#hello{font-size:12px;letter-spacing:3px;color:#cfcfcf;margin:0 0 16px}#hello b{color:#fff}#hello a{color:#8a8a8a;margin-left:10px;cursor:pointer;text-decoration:underline;font-size:10px}
#lvGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin:0 auto 6px}
.lv{position:relative;aspect-ratio:3/4;border:1px solid #ffffff40;background:#0a0a0bcc;color:#fff;cursor:pointer;padding:10px 6px;font:inherit;display:flex;flex-direction:column;align-items:center;justify-content:space-between;border-radius:10px;transition:transform .15s,border-color .15s}
.lv:hover:not(.lock),.lv:focus-visible{border-color:var(--red);transform:translateY(-3px)}
.lv .n{font-size:clamp(26px,5vmin,40px);font-weight:900;line-height:1}.lv .t{font-size:9px;letter-spacing:1.5px;line-height:1.35;color:#d0d0d0}.lv .s{font-size:9px;letter-spacing:1px;color:#8d8d8d;min-height:11px}
.lv.done .n{color:var(--red)}.lv.cur{border-color:var(--red);box-shadow:0 0 22px #d8262c55}.lv.cur .s{color:#ff8a8e}
.lv.lock{opacity:.38;cursor:not-allowed}.lv.lock .n{color:#777}
.wide{width:min(640px,94%)!important}
body.narrow #lvGrid{grid-template-columns:repeat(3,1fr)}
body.short .panel{padding:8px 16px}body.short h1{font-size:30px;margin-bottom:2px}body.short .sub{margin-bottom:8px}body.short #hello{margin-bottom:8px}body.short .lv{aspect-ratio:1/1;padding:6px 4px}body.short .lv .n{font-size:24px}body.short #scrLevels .desc{display:none}body.short .btn{padding:11px 22px;margin-top:8px}
/* ===== v5 additions ===== */
body.nl .sub,body.nl .desc,body.nl .keys,body.nl .rot,body.nl .btn,body.nl .lbl,body.nl #hello,body.nl .lv .t,body.nl .lv .s,body.nl #story,body.nl #act,body.nl #tip,body.nl #tip *,body.nl #loading *,body.nl #nameIn{letter-spacing:.2px!important;text-transform:none!important}
body.nl .lv .t{font-size:11px;line-height:1.4}body.nl .lv .s{font-size:10px}body.nl .btn{font-size:14px}body.nl .sub{font-size:13px}
#story{top:15%}
#tip{position:absolute;left:max(16px,env(safe-area-inset-left));bottom:max(18px,env(safe-area-inset-bottom));width:min(370px,calc(100vw - 32px));padding:12px 16px 15px;border-radius:12px;background:linear-gradient(180deg,#15161bee,#09090cf2);border:1px solid #ffffff1f;border-left:3px solid var(--red);box-shadow:0 12px 36px #000d,0 0 24px #d8262c26;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#ececec;opacity:0;transform:translateX(-30px);transition:opacity .45s,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none;overflow:hidden;text-shadow:none}
#tip.on{opacity:1;transform:none}
#tip .tg{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:3px;font-weight:800;color:#ff6b70;text-transform:uppercase;margin-bottom:7px}
#tip .tg i{width:7px;height:7px;background:var(--red);transform:rotate(45deg);box-shadow:0 0 9px var(--red)}
#tip .tb{font-size:14px;line-height:1.55;letter-spacing:.3px;color:#f1f1f1}
#tip .tb small{display:block;margin-top:8px;font-size:11px;letter-spacing:1.4px;color:#b5b5b5}
#tip .bar{position:absolute;left:0;bottom:0;height:2px;width:100%;background:linear-gradient(90deg,var(--red),#ff9a9e);transform-origin:left;transform:scaleX(0)}
#tip.on .bar{animation:tipbar var(--d,6s) linear forwards}
@keyframes tipbar{from{transform:scaleX(1)}to{transform:scaleX(0)}}
#tip.hint{border-left-color:#f2f2f2}#tip.hint .tg{color:#fff}#tip.hint .tg i{background:#fff;box-shadow:0 0 9px #fff}#tip.hint .bar{background:linear-gradient(90deg,#fff,#aaa)}
#tip.warn .tg{color:#fff}#tip.warn{background:linear-gradient(180deg,#2a0a0cf2,#12050699);border-color:#d8262c88}
.touch.playing #tip{bottom:max(112px,calc(env(safe-area-inset-bottom) + 104px));width:min(340px,46vw)}
#langRow{display:flex;gap:8px;justify-content:center;margin-top:10px}
.lg{border:1px solid #ffffff44;background:#0a0a0bcc;color:#d6d6d6;font:inherit;font-size:13px;padding:7px 16px;border-radius:99px;cursor:pointer}
.lg.on{border-color:var(--red);color:#fff;background:#d8262c33}
#scrLang .btn{min-width:260px;font-size:17px;letter-spacing:2px}
#loading{position:absolute;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 58%,#1a070af5,#030304 74%);color:var(--paper);padding:20px;text-align:center;pointer-events:auto}
#loading.on{display:flex;animation:ldin .5s ease}
@keyframes ldin{from{opacity:0}to{opacity:1}}
#ldRecap{font-size:11px;letter-spacing:3px;color:#9d9d9d;margin-bottom:22px;min-height:14px}
#ldCh{font-size:11px;letter-spacing:6px;color:#ff6b70;margin-bottom:8px;font-weight:800}
#ldName{font-size:clamp(22px,5.6vmin,42px);font-weight:900;letter-spacing:6px;margin-bottom:8px;text-shadow:0 0 28px #d8262c77}
#ldIntro{font-size:14px;color:#cfcfcf;max-width:480px;line-height:1.6;margin-bottom:64px;min-height:44px}
.ldw{width:min(740px,94%);padding:0 26px 0 88px}
.ldtrack{position:relative;height:12px;border-radius:99px;background:#ffffff14;border:1px solid #ffffff26;box-shadow:inset 0 2px 6px #000}
.ldfill{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:99px;background:linear-gradient(90deg,#6e0e13,#d8262c 60%,#ff7a7f);box-shadow:0 0 16px #d8262c,0 0 44px #d8262c99;overflow:hidden}
.ldfill:after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff99 50%,transparent 70%);transform:translateX(-100%);animation:shine 1.05s linear infinite}
@keyframes shine{to{transform:translateX(100%)}}
.ldrun{position:absolute;left:0;top:0;width:0;height:12px}
.ldrun svg{position:absolute;left:-22px;bottom:9px;width:44px;height:60px;overflow:visible;animation:bob .24s ease-in-out infinite}
.ldpct{position:absolute;right:30px;bottom:14px;font-size:20px;font-weight:900;letter-spacing:2px;color:#fff;text-shadow:0 0 12px #d8262c,0 0 24px #d8262c88;white-space:nowrap;font-variant-numeric:tabular-nums}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
.lgA{transform-origin:22px 36px;animation:legA .48s ease-in-out infinite}.lgB{transform-origin:22px 36px;animation:legA .48s ease-in-out infinite;animation-delay:-.24s}
@keyframes legA{0%,100%{transform:rotate(-42deg)}50%{transform:rotate(42deg)}}
.armA{transform-origin:22px 22px;animation:legA .48s ease-in-out infinite;animation-delay:-.24s}
.scarf{transform-origin:20px 17px;animation:flap .3s ease-in-out infinite}
@keyframes flap{0%,100%{transform:skewY(-6deg) scaleX(1)}50%{transform:skewY(8deg) scaleX(1.18)}}
#ldTip{margin-top:30px;font-size:12px;letter-spacing:1.5px;color:#8f8f8f;max-width:520px;line-height:1.6}
body.short #ldIntro{margin-bottom:40px;min-height:0}body.short #ldRecap{margin-bottom:10px}body.short #ldTip{margin-top:16px}
/* ===== v5.1 additions ===== */
#tip{-webkit-backdrop-filter:none;backdrop-filter:none;background:linear-gradient(180deg,#15161bf8,#09090cfb)}
.lrow,#langRow{display:flex;gap:8px;justify-content:center}.lrow{margin:0 0 18px}
#timer{font-size:13px;font-weight:800;letter-spacing:2px;padding:5px 12px;border:1px solid #ffffff40;border-radius:99px;background:#0c0f14b0;font-variant-numeric:tabular-nums;text-shadow:none;transition:opacity .4s;color:#fff}
#timer.low{color:#ff6b70;border-color:var(--red);animation:tpulse .8s ease-in-out infinite}
#timer.burn{background:var(--red);color:#fff;border-color:#ff9a9e;animation:tpulse .4s ease-in-out infinite}
#timer.off{opacity:0}
@keyframes tpulse{50%{transform:scale(1.13)}}
#task{position:absolute;top:max(60px,calc(env(safe-area-inset-top) + 52px));left:50%;transform:translate(-50%,-150%);min-width:250px;max-width:min(440px,84vw);padding:9px 18px 13px;border-radius:12px;background:linear-gradient(180deg,#1d0709f7,#0a0a0df7);border:1px solid #d8262c99;box-shadow:0 8px 28px #000c,0 0 22px #d8262c44;text-align:center;text-shadow:none;opacity:0;transition:transform .45s cubic-bezier(.2,.9,.2,1),opacity .3s;overflow:hidden;color:#f1f1f1}
#task.on{opacity:1;transform:translate(-50%,0)}
#task .tk{display:flex;justify-content:center;gap:10px;align-items:baseline;font-size:10px;letter-spacing:3px;font-weight:800;color:#ff6b70;margin-bottom:3px}
#task .tk b{font-size:15px;letter-spacing:1px;color:#fff;font-variant-numeric:tabular-nums}
#taskTxt{font-size:13.5px;line-height:1.4}
#task .tbar{position:absolute;left:0;bottom:0;height:3px;width:100%;background:#ffffff14}#task .tbar i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),#ff9a9e)}
#task.win{border-color:#fff;box-shadow:0 8px 28px #000c,0 0 26px #ffffff55}#task.win #taskTxt{font-weight:800}#task.win .tbar i{background:#fff}
#task.fail{border-color:#555;filter:grayscale(1)}
body.nl #task *{letter-spacing:.2px!important}
.quote{display:block;margin-top:14px;font-size:12.5px;line-height:1.6;color:#bdbdbd}.quote i{display:block;margin-top:3px;color:#8f8f8f}
#ldQuote{margin-top:34px;max-width:560px;font-size:14px;line-height:1.65;color:#d0d0d0}
#ldA{display:block;margin-top:6px;font-style:italic;font-size:12.5px;color:#9a9a9a}
.ldrun canvas{position:absolute;left:-60px;bottom:-1px;width:120px;height:120px;pointer-events:none}
.ldpct{right:42px;bottom:16px}
.ldw{padding:0 26px 0 106px}
body.short #ldQuote{margin-top:14px;font-size:12.5px}
/* ===== v5.3: hint box top-left, landscape/portrait option, YOU LOST, new hazards ===== */
#tip{bottom:auto;top:max(58px,calc(env(safe-area-inset-top) + 50px));width:min(370px,46%);transform:translateY(-14px)}
#tip.on{transform:none}
.touch.playing #tip{bottom:auto;width:min(340px,46%)}
#task{left:auto;right:max(16px,env(safe-area-inset-right));transform:translate(0,-170%);min-width:0;width:max-content;max-width:min(440px,48%)}
#task.on{transform:none}
body.portrait .brand{display:none}
body.portrait #task{left:16px;right:16px;width:auto;max-width:none}
body.portrait #tip,body.portrait.touch.playing #tip{width:calc(100% - 32px);top:max(132px,calc(env(safe-area-inset-top) + 124px))}
body.portrait #story{top:30%}
body.rotL #wrap{inset:auto;left:50%;top:50%;transform:translate(-50%,-50%) rotate(90deg)}
body.colP #wrap{left:50%;right:auto;transform:translateX(-50%);box-shadow:0 0 0 1px #ffffff1f,0 0 60px #000}
body.short h1{font-size:22px;margin:0}body.short .lv{aspect-ratio:auto;min-height:74px}body.short #langRow,body.short #oriRow{margin-top:6px}body.short .lrow{margin-bottom:8px}
#oriRow{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
#oriRow .lg{font-size:11.5px;letter-spacing:1.5px;padding:7px 13px}
#lost{position:absolute;inset:0;z-index:25;display:none;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 48%,#4a060acc,#030304f4 72%);color:#fff;text-align:center;padding:20px;pointer-events:auto;overflow:hidden}
#lost.on{display:flex;animation:ldin .45s ease}
#lostName{font-size:clamp(22px,6vmin,46px);font-weight:900;letter-spacing:9px;text-shadow:0 0 10px #fff,0 0 26px #ffffffaa,0 0 60px #d8262c;margin-bottom:6px;animation:lostin .7s cubic-bezier(.2,1.5,.4,1) both}
#lostTxt{font-size:clamp(44px,14vmin,128px);line-height:1.08;font-weight:900;letter-spacing:6px;color:#fff;animation:lostin .8s .15s cubic-bezier(.2,1.6,.4,1) both,lostglow 1.3s ease-in-out infinite}
body.nl #lostTxt{font-size:clamp(32px,10vmin,96px);letter-spacing:1px;line-height:1.3}body.nl #lostName{letter-spacing:4px}
#lostSub{margin-top:14px;font-size:12px;letter-spacing:3px;color:#ffb3b6;text-transform:uppercase}
#lostBtns{margin-top:22px;opacity:0;pointer-events:none;transition:opacity .6s}
#lost.btns #lostBtns{opacity:1;pointer-events:auto}
@keyframes lostin{from{opacity:0;transform:scale(2.2)}to{opacity:1;transform:none}}
@keyframes lostglow{0%,100%{text-shadow:0 0 8px #fff,0 0 26px #ff6b70,0 0 60px #d8262c,0 0 120px #d8262c}50%{text-shadow:0 0 14px #fff,0 0 44px #ff8a8e,0 0 100px #ff2a32,0 0 190px #d8262c}}
/* ===== v5.4: rotate button, walking trees, lasers, shield ===== */
#bOri{position:absolute;z-index:40;top:max(12px,env(safe-area-inset-top));left:max(12px,env(safe-area-inset-left));width:36px;height:36px;border-radius:50%;border:1px solid #ffffff55;background:#0c0f14d0;color:#fff;display:grid;place-items:center;cursor:pointer;padding:0;pointer-events:auto}
#bOri svg{width:20px;height:20px;transition:transform .35s}
body.portrait #bOri svg{transform:rotate(90deg)}
#bOri:active{transform:scale(.93)}
.top{padding-left:44px}
body.ytp #bOri,body.ytp #oriRow,body.ytp #bMute,body.ytp #chg{display:none}
h1{font-size:clamp(22px,min(8.5vmin,7vw),60px);letter-spacing:.15em;max-width:100%}
#overlay{grid-template-columns:minmax(0,1fr)}.panel{max-width:100%;min-width:0;justify-self:center}.lv{min-width:0}.lv .t,.desc,.keys{overflow-wrap:anywhere}body.narrow .panel{padding-left:6px;padding-right:6px}body.narrow #lvGrid{gap:7px}
#boot{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#050506;color:#ececec;text-align:center;pointer-events:none}#boot b{font-size:clamp(26px,7vmin,52px);letter-spacing:8px;font-weight:900}#boot b span{color:#d8262c}#boot i{margin-top:14px;font-style:normal;font-size:12px;letter-spacing:5px;color:#b9b8b2;animation:tpulse 1s ease-in-out infinite}#boot.off{display:none}body.ytp .top{padding-left:0}
</style>

<body>
<!-- YouTube Playables SDK must load before all game code. It does nothing outside Playables. -->
<script src="https://www.youtube.com/game_api/v1"></script>
<div id="wrap">
<canvas id="game" aria-label="SHADOWBOUND game"></canvas>
<div id="hud">
 <div class="top"><div class="brand">SHADOW<span>BOUND</span></div><div id="timer">0:00</div><div id="act"></div>
  <button class="hb" id="bMute" aria-label="Sound on or off">&#9835;</button><button class="hb" id="bPause" aria-label="Pause">II</button></div>
 <div id="story" aria-live="polite"></div>
 <div id="tip" aria-live="polite"><div class="tg"><i></i><span id="tipTag"></span></div><div class="tb" id="tipBody"></div><div class="bar"></div></div>
 <div id="task"><div class="tk"><span id="taskTag"></span><b id="taskT"></b></div><div id="taskTxt"></div><div class="tbar"><i id="taskBar"></i></div></div>
</div>
<div id="controls">
 <div class="pad"><button class="ctrl" id="cLeft" aria-label="Move left">&#9664;</button><button class="ctrl" id="cRight" aria-label="Move right">&#9654;</button></div>
 <div class="pad"><button class="ctrl" id="cGrab" aria-label="Grab or use">&#9995;</button><button class="ctrl big" id="cJump" aria-label="Jump">&#9650;</button></div>
</div>
<button id="bOri" aria-label="Switch landscape or portrait"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="13" height="8" rx="1.6"/><path d="M19 6.5a7 7 0 0 1 0 11"/><path d="M21.2 15.6 19 17.6l-2-2.2"/></svg></button>
<div id="boot" role="status"><b>SHADOW<span>BOUND</span></b><i>LOADING…</i></div>
<div id="overlay">
 <div class="panel" id="panel">
  <h1>SHADOW<span>BOUND</span></h1>
  <p class="sub" id="ovSub">A SILENT WORLD. A WAY OUT.</p>
  <div class="scr" id="scrName">
   <div class="lrow" id="langRow0"></div>
   <p class="lbl" id="lblName">ENTER YOUR NAME</p>
   <input id="nameIn" type="hidden">
   <button class="btn" id="bName">CONTINUE</button>
  </div>
  <div class="scr" id="scrLevels">
   <p id="hello"></p>
   <div id="lvGrid"></div>
   <p class="desc"><span class="keys" id="keysHint"></span></p>
   <div id="langRow"></div>
  </div>
  <div class="scr" id="scrMsg">

"hint.chase":"ஓடு! தடைகளைத் தாவு, நெம்புகோலை இழு, கதவு மூடும் முன் நுழைந்துவிடு.","hint.saws":"ஓரத்தில் நில். ரம்பம் விலகிச் செல்லும்போது தாவு.","hint.vents":"சிவப்பு ஒளியைக் கவனி. துவாரம் குளிர்ந்திருக்கும்போது கடந்துசெல்.","hint.stalactites":"உள்ளே நடந்தால் அவை விழும். உடைந்த துண்டைத் தாவு.",

{a:"Benjamin Franklin",en:"Lost time is never found again.",ta:"இழந்த நேரம் மீண்டும் கிடைப்பதில்லை.",hi:"खोया हुआ समय फिर कभी नहीं मिलता।"},
{a:"Leo Tolstoy",en:"The two most powerful warriors are patience and time.",ta:"மிக வலிமையான இரு போர்வீரர்கள் பொறுமையும் காலமும்.",hi:"सबसे शक्तिशाली दो योद्धा हैं धैर्य और समय।"},
{a:"William Shakespeare",en:"Better three hours too soon than a minute too late.",ta:"ஒரு நிமிடம் தாமதிப்பதை விட மூன்று மணி நேரம் முன்னதாக வருவது மேல்.",hi:"एक मिनट देर से आने से तीन घंटे पहले आना बेहतर है।"},
{a:"William Shakespeare",en:"I wasted time, and now doth time waste me.",ta:"நான் நேரத்தை வீணடித்தேன்; இப்போது நேரம் என்னை வீணடிக்கிறது.",hi:"मैंने समय बर्बाद किया, और अब समय मुझे बर्बाद कर रहा है।"},
{a:"Nathaniel Hawthorne",en:"Time flies over us, but leaves its shadow behind.",ta:"காலம் நம் மேல் பறந்து செல்கிறது; ஆனால் தன் நிழலை விட்டுச் செல்கிறது.",hi:"समय हमारे ऊपर से उड़ जाता है, पर अपनी परछाईं पीछे छोड़ जाता है।"},
{a:"Benjamin Franklin",en:"You may delay, but time will not.",ta:"நீ தாமதிக்கலாம்; காலம் தாமதிக்காது.",hi:"तुम देर कर सकते हो, पर समय नहीं करेगा।"},
{a:"Seneca",en:"It is not that we have a short time to live, but that we waste a lot of it.",ta:"நமக்கு வாழக் கிடைத்த காலம் குறைவல்ல; அதில் பெரும்பகுதியை நாம் வீணடிக்கிறோம்.",hi:"ऐसा नहीं कि हमारे पास जीने को कम समय है; बात यह है कि हम उसका बहुत सा हिस्सा गँवा देते हैं।"},
{a:"Theophrastus",en:"Time is the most valuable thing a man can spend.",ta:"மனிதன் செலவழிக்கக்கூடியவற்றில் மிக விலைமதிப்பானது நேரம்.",hi:"समय सबसे क़ीमती चीज़ है जिसे इंसान ख़र्च कर सकता है।"},
{a:"Hector Berlioz",en:"Time is a great teacher, but unfortunately it kills all its pupils.",ta:"காலம் ஒரு சிறந்த ஆசிரியர்; ஆனால் துரதிர்ஷ்டவசமாக அது தன் மாணவர்கள் அனைவரையும் கொன்றுவிடுகிறது.",hi:"समय एक महान शिक्षक है, पर दुर्भाग्य से वह अपने सभी शिष्यों को मार डालता है।"},
{a:"Seneca",en:"Nothing is ours, except time.",ta:"காலத்தைத் தவிர எதுவும் நம்முடையதல்ல.",hi:"समय के सिवा कुछ भी हमारा नहीं है।"},
{a:"Benjamin Franklin",en:"Dost thou love life? Then do not squander time, for that is the stuff life is made of.",ta:"நீ வாழ்க்கையை நேசிக்கிறாயா? அப்படியெனில் நேரத்தை வீணாக்காதே; வாழ்க்கை அதனால்தான் ஆனது.",hi:"क्या तुम्हें जीवन से प्यार है? तो समय मत गँवाओ, क्योंकि जीवन उसी से बना है।"},
{a:{en:"Thiruvalluvar, Kural 484",ta:"திருவள்ளுவர், குறள் 484",hi:"तिरुवल्लुवर, कुरल 484"},en:"Even the whole world can be won, if you act at the right time and in the right place.",ta:"ஞாலம் கருதினுங் கைகூடுங் காலம் கருதி இடத்தாற் செயின்.",hi:"सही समय और सही जगह पर किया गया काम पूरी दुनिया भी जीत सकता है।"},
{a:{en:"Kabir",ta:"கபீர்",hi:"कबीर"},en:"What you would do tomorrow, do today; what you would do today, do now.",ta:"நாளை செய்ய நினைப்பதை இன்றே செய்; இன்று செய்ய நினைப்பதை இப்போதே செய்.",hi:"काल करे सो आज कर, आज करे सो अब। पल में परलय होएगी, बहुरि करेगा कब॥"}
];

Object.assign(TXT.en,{"cap.tide":"The water breathes. Walk when it exhales.","hint.tide":"Wade while the water is low. Climb a stone before it rises.","cap.belts":"The floor has its own plans.","hint.belts":"The belt drags you. Jump the blades and do not stand still.",
"cap.blinkers":"Some ground only exists for a moment.","hint.blinkers":"Jump when your platform starts to flicker. The next one is about to appear.","cap.meteors":"The sky is falling. Watch the ground.","hint.meteors":"A red ring marks where fire will land. Stay out of it."});
Object.assign(TXT.ta,{"cap.tide":"நீர் மூச்சுவிடுகிறது. அது வெளியேறும்போது நட.","hint.tide":"நீர் தாழ்ந்திருக்கும்போது நடந்து செல். அது உயரும் முன் ஒரு கல்லின் மேல் ஏறு.","cap.belts":"தரைக்குத் தனியாக ஒரு திட்டம் இருக்கிறது.","hint.belts":"பட்டை உன்னை இழுக்கும். ரம்பங்களைத் தாவு; நின்றுவிடாதே.",
"cap.blinkers":"சில நிலம் ஒரு கணம் மட்டுமே இருக்கும்.","hint.blinkers":"உன் மேடை மினுக்கத் தொடங்கும்போது தாவு. அடுத்தது தோன்றப்போகிறது.","cap.meteors":"வானம் விழுகிறது. தரையைக் கவனி.","hint.meteors":"நெருப்பு விழும் இடத்தைச் சிவப்பு வளையம் காட்டும். அதற்குள் நிற்காதே."});
Object.assign(TXT.hi,{"cap.tide":"पानी साँस लेता है। जब वह साँस छोड़े, तब चलो।","hint.tide":"पानी नीचे हो तब चलो। उसके चढ़ने से पहले किसी पत्थर पर चढ़ जाओ।","cap.belts":"फ़र्श के अपने इरादे हैं।","hint.belts":"पट्टा तुम्हें खींचता है। आरियों के ऊपर से कूदो और रुको मत।",
"cap.blinkers":"कुछ ज़मीन बस एक पल के लिए होती है।","hint.blinkers":"जब तुम्हारा प्लेटफ़ॉर्म टिमटिमाने लगे तब कूदो। अगला दिखने ही वाला है।","cap.meteors":"आसमान गिर रहा है। ज़मीन पर नज़र रखो।","hint.meteors":"लाल घेरा बताता है कि आग कहाँ गिरेगी। उससे दूर रहो।"});

Object.assign(TXT.ta,{"keys.mouse":"மவுஸ் மட்டும்: இடது பொத்தானை அழுத்திப் பிடித்தால் கர்சர் பக்கம் ஓடுவாள் · அவளுக்கு மேலே காட்டினால் தாவுவாள் · வலது பொத்தான் பிடிக்கும்/இயக்கும்","name.def":"வீரர்","lost.title":"நீ தோற்றுவிட்டாய்","lost.sub":"நேரம் முடிந்தது · அத்தியாயம் %n","btn.again":"மீண்டும் முயற்சி செய்","ori.auto":"தானியங்கி","ori.land":"கிடைமட்டம்","ori.port":"செங்குத்து",
"cap.fans":"காற்று உன்னைத் தூக்கும். அது வீசும் வரை மட்டும்.","cap.updraft":"மேலே செல்ல ஒரே வழி காற்றுதான்.","cap.antigrav":"இங்கே கீழே என்பதே மேலே.","cap.flip2":"இரண்டு முறை வானம் தரையாகும்.","cap.holes":"தரையை நம்பாதே.","cap.spikes":"தரைக்கு அடியில் ஏதோ காத்திருக்கிறது.","cap.gauntlet":"குழிகளும் ஈட்டிகளும். யோசிக்க நேரமில்லை.",
"hint.fans":"காற்றுத் தூணுக்குள் தாவு. விசிறி ஓடும்போது மிதந்து, அது நிற்கும் முன் அடுத்த தூணுக்கு நகர்.","hint.updraft":"விசிறி மேல் நில். அது உன்னை மேடைக்கு மேலே தூக்கும்; பிறகு பாறை மீது நகர்.","hint.antigrav":"ஒளி எரியும்போது உள்ளே நுழை. நீ கூரைக்கு விழுவாய். ஒளி அணையும் முன் கூரை மீது ஓடிக் கடந்து விடு. கூரை முட்களைத் தாவு.",
"hint.flip2":"முதல் புலம் அணையும் முன் நடுத்தீவில் இறங்கு. இரண்டாவது எரியும் வரை அங்கே காத்திரு.","hint.holes":"தரை நடுங்கினால் உடனே தாவு. குழிக்குள் ஸ்பிரிங் இருந்தால் அது உன்னை வெளியே வீசும்.","hint.spikes":"துளையுள்ள தகடுகள் மீது நிற்காதே. ஓடிக்கொண்டே இரு. கல் மேடைகள் பாதுகாப்பானவை.","hint.gauntlet":"நிற்காமல் ஓடு, குழி திறந்தால் தாவு, கல் மேடையில் மூச்சு வாங்கு."});
Object.assign(TXT.hi,{"keys.mouse":"सिर्फ़ माउस: बायाँ बटन दबाए रखो तो वह कर्सर की ओर दौड़ेगी · उसके ऊपर इशारा करो तो कूदेगी · दायाँ बटन पकड़ता/चलाता है","name.def":"खिलाड़ी","lost.title":"तुम हार गए","lost.sub":"समय समाप्त · अध्याय %n","btn.again":"फिर कोशिश करो","ori.auto":"ऑटो","ori.land":"लैंडस्केप","ori.port":"पोर्ट्रेट",
"cap.fans":"हवा तुम्हें उठा लेगी। बस जब तक वह चलती है।","cap.updraft":"ऊपर जाने का एक ही रास्ता है: हवा।","cap.antigrav":"यहाँ नीचे ही ऊपर है।","cap.flip2":"दो बार आसमान ज़मीन बनेगा।","cap.holes":"ज़मीन पर भरोसा मत करो।","cap.spikes":"फ़र्श के नीचे कुछ इंतज़ार कर रहा है।","cap.gauntlet":"गड्ढे और भाले। सोचने का समय नहीं।",
"hint.fans":"हवा के खंभे में कूदो। पंखा चलते समय तैरो, और उसके रुकने से पहले अगले खंभे में पहुँचो।","hint.updraft":"पंखे पर खड़े हो जाओ। वह तुम्हें चट्टान से ऊपर उठाएगा, फिर चट्टान पर उतर जाओ।","hint.antigrav":"जब रोशनी जले तब अंदर जाओ। तुम छत पर गिरोगे। रोशनी बुझने से पहले छत पर दौड़कर पार करो। छत के काँटों पर से कूदो।",
"hint.flip2":"पहला क्षेत्र बुझने से पहले बीच के टापू पर उतरो। दूसरे के जलने तक वहीं रुको।","hint.holes":"ज़मीन काँपे तो तुरंत कूदो। गड्ढे में स्प्रिंग हो तो वह तुम्हें बाहर फेंक देगा।","hint.spikes":"छेद वाली पट्टियों पर मत रुको। दौड़ते रहो। पत्थर के चबूतरे सुरक्षित हैं।","hint.gauntlet":"बिना रुके दौड़ो, गड्ढा खुले तो कूदो, पत्थर के चबूतरे पर साँस लो।"});
Object.assign(TXT.en,{"cap.treant":"The trees here walk. And they hate the light.","cap.grove":"A grove that hunts. Take the shield.","cap.turret":"The red eye never misses. Only stone stops it.","cap.crossfire":"Two eyes. Half the time.","cap.spinner":"Light that turns like a blade.","cap.wild":"Root, blade and eye. All at once.",

Object.assign(TXT.ta,{"cap.treant":"இங்கே மரங்கள் நடக்கும். அவை ஒளியை வெறுக்கும்.","cap.grove":"வேட்டையாடும் தோப்பு. கவசத்தை எடு.","cap.turret":"சிவப்புக் கண் தவறாது. கல் மட்டுமே அதைத் தடுக்கும்.","cap.crossfire":"இரண்டு கண்கள். பாதி நேரம்.","cap.spinner":"கத்தி போலச் சுழலும் ஒளி.","cap.wild":"வேர், கத்தி, கண். எல்லாம் ஒன்றாக.",
"hint.treant":"அருகில் சென்று அதை அடிக்க வை, பின்னால் விலகு; அதன் கிளை தரையில் சிக்கியிருக்கும்போது ஓடிக் கட. கவசம் ஒரு அடியைத் தாங்கும்.","hint.grove":"ஒளிரும் கோளத்தைத் தொட்டால் கவசம் கிடைக்கும். அது ஒரு அடியைத் தடுக்கும். அடுத்த மரத்தை ஏமாற்று: உள்ளே போ, வெளியே வா, ஓடு.","hint.turret":"தூணுக்குப் பின்னால் காத்திரு. சுட்ட உடனே அடுத்த தூணுக்கு ஓடு.",
"hint.crossfire":"இரண்டு லேசர்களும் மாறி மாறிச் சுடும். ஒவ்வொரு சூட்டுக்குப் பின் ஒரு தூண் நகர்.","hint.spinner":"தரையைத் துடைக்கும் கைக்குப் பின்னாலேயே செல். அடுத்த கை உன்னைப் பிடிக்க விடாதே.","hint.wild":"கவசத்தை எடு. மரத்தை ஏமாற்று, சுழலும் கையைப் பின்தொடர், பிறகு தூணுக்குத் தூண்."});

  return '<button class="lv'+(lock?' lock':'')+(b?' done':'')+(cur?' cur':'')+'" data-i="'+i+'"'+(lock?' disabled':'')+'><span class="n">'+(i+1)+'</span><span class="t">'+tx('ch.'+i+'.name')+'</span><span class="s">'+(lock?tx('locked'):cur?tx('cont'):b?tx('best').replace('%t',fmt(b.t)).replace('%d',b.d):tx('new'))+'</span></button>';}).join('');

 else{ovSub.textContent=tx('sub.end');
  ovDesc.innerHTML=tx('done.end').replace('%s',esc(pname()))+'<span class="keys">'+tx('time')+' '+fmt(playT)+' · '+tx('falls')+' '+deaths+'</span>';

const ldEl=$('loading'),ldFill=$('ldFill'),ldRun=$('ldRun'),ldPct=$('ldPct');

function startLoading(next,recap,resume){audioInit();audioUnlock();mode='loading';clearStory();paused=false;overlay.style.display='none';document.body.classList.remove('playing');

 let t0=performance.now();const K=[[0,0],[.6,13],[1.4,36],[1.8,40],[2.9,68],[3.3,72],[4.3,100]];let lt=t0,done=false;
 (function tick(){const now=performance.now();if(ytPaused){t0+=now-lt;lt=now;requestAnimationFrame(tick);return;}const t=(now-t0)/1000,dt=Math.min(.05,Math.max(0,(now-lt)/1000));lt=now;let pct=100;
  for(let i=1;i<K.length;i++)if(t<K[i][0]){const a=K[i-1],b=K[i],u=(t-a[0])/(b[0]-a[0]);pct=lerp(a[1],b[1],smooth(u)*.35+u*.65);break;}
  setLd(pct);try{drawLdGirl(dt);}catch(e){}if(t<4.8)requestAnimationFrame(tick);else if(!done){done=true;ldEl.classList.remove('on');play(next,!!resume);}})();}

/* ---------- input ---------- */
const src={k:{},t:{},g:{},m:{}};
function syncInput(){const j=input.jump,g=input.grab;for(const n of['left','right','jump','grab'])input[n]=!!(src.k[n]||src.t[n]||src.g[n]||src.m[n]);if(input.jump&&!j)tapJ=true;if(input.grab&&!g)tapG=true;}
const KEYS={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'jump',w:'jump',W:'jump',' ':'jump',e:'grab',E:'grab',ArrowDown:'grab',s:'grab',S:'grab',Shift:'grab'};
window.addEventListener('keydown',e=>{if(e.target===nameIn){if(e.key==='Enter')submitName();return;}
 const k=KEYS[e.key];if(k){e.preventDefault();src.k[k]=true;syncInput();}
 else if(e.key==='Escape'||e.key==='p'||e.key==='P'){setPaused(!paused);}
 else if((e.key==='m'||e.key==='M')&&!yt()){bMute.click();}
 else if(e.key==='Enter'&&mode==='lost'&&lostEl.classList.contains('btns')){$('lostRetry').click();}
 else if(e.key==='Enter'&&screen==='scrMsg'&&overlay.style.display!=='none'){b1.click();}});
window.addEventListener('keyup',e=>{const k=KEYS[e.key];if(k){src.k[k]=false;syncInput();}});
window.addEventListener('blur',()=>{src.k={};src.t={};src.m={};MS.l=MS.r=false;syncInput();});
function bindButton(id,key){const el=$(id);const on=e=>{e.preventDefault();src.t[key]=true;el.classList.add('down');syncInput();try{el.setPointerCapture(e.pointerId);}catch(_){}};
 const off=e=>{e.preventDefault();src.t[key]=false;el.classList.remove('down');syncInput();};
 el.addEventListener('pointerdown',on);['pointerup','pointercancel','lostpointercapture'].forEach(ev=>el.addEventListener(ev,off));el.addEventListener('contextmenu',e=>e.preventDefault());}
bindButton('cLeft','left');bindButton('cRight','right');bindButton('cJump','jump');bindButton('cGrab','grab');

const hasTouch=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;setTouch(hasTouch);
window.addEventListener('pointerdown',e=>{if(e.pointerType==='touch')setTouch(true);},true);
canvas.addEventListener('contextmenu',e=>e.preventDefault());
['pointerdown','pointerup','touchend','keydown','click'].forEach(ev=>window.addEventListener(ev,()=>{if(mode==='play')audioUnlock();},true));
/* mouse only: hold the left button to run toward the cursor, point above her head to jump (keeps hopping while held), right button grabs / uses */
const MS={on:false,l:false,r:false,x:0,y:0,pj:false};
const mUpd=e=>{if(e.pointerType!=='mouse')return;MS.on=true;MS.x=e.clientX;MS.y=e.clientY;MS.l=!!(e.buttons&1);MS.r=!!(e.buttons&2);if(e.type==='pointerdown'){try{canvas.setPointerCapture(e.pointerId);}catch(_){}e.preventDefault();}};
['pointerdown','pointermove','pointerup','pointercancel'].forEach(ev=>canvas.addEventListener(ev,mUpd));
function pollMouse(){if(!MS.on)return;let L=false,R=false,J=false;const live=mode==='play'&&!paused&&!document.body.classList.contains('rotL');
 if(MS.l&&live){const r=wrapEl.getBoundingClientRect(),px=r.left+(p.x+p.w/2-camX)*SC,py=r.top+(p.y+OY)*SC,dx=MS.x-px;if(dx>16*SC)R=true;else if(dx<-16*SC)L=true;J=MS.y<py-60*SC&&!(p.onGround&&MS.pj);}
 MS.pj=J;const g=MS.r&&live,m=src.m;if(!!m.left!==L||!!m.right!==R||!!m.jump!==J||!!m.grab!==g){src.m={left:L,right:R,jump:J,grab:g};syncInput();}}
function pollPad(){let g=null;try{const a=navigator.getGamepads?navigator.getGamepads():[];for(const x of a)if(x&&x.connected){g=x;break;}}catch(e){}
 if(!g){if(src.g.on){src.g={};syncInput();}return;}const ax=g.axes[0]||0,b=i=>!!(g.buttons[i]&&g.buttons[i].pressed);
 const st=b(9);if(st&&!src.g.st)setPaused(!paused);
 src.g={on:1,left:ax<-.35||b(14),right:ax>.35||b(15),jump:b(0),grab:b(2)||b(1)||b(5),st};syncInput();}

/* ---------- main loop ---------- */
const STEP=1/120;let last=0,acc=0;
function frame(ts){requestAnimationFrame(frame);if(ytPaused){last=ts;return;}const raw=Math.max(0,(ts-last)/1000)||0,dt=Math.min(.05,snapDt(raw));last=ts;pollPad();pollMouse();
 if(mode==='play'&&!paused&&raw<.25){perfT+=raw;perfN++;if(perfT>1.5){const av=perfT/perfN;if(av>.0235&&QCAP>1){QCAP=Math.max(1,Math.min(QCAP,window.devicePixelRatio||1)-(av>.04?.5:.25));resize();}perfT=0;perfN=0;}}
 if(mode==='play'&&!paused&&dt>0){const n=clamp(Math.round(dt/STEP),1,8),h=dt/n*GS;for(let i=0;i<n;i++){try{step(h);}catch(e){console.error(e);}}}
 else if(!paused)T+=dt;
 try{frameFx(paused?0:dt);}catch(e){console.error(e);}try{audioUpdate(dt);}catch(e){}try{draw();}catch(e){console.error(e);}try{uiUpdate(dt);}catch(e){console.error(e);}

 try{y.system.onResume(()=>{ytPaused=false;try{if(AU.ac&&AU.user&&AU.yt)AU.ac.resume();}catch(e){}last=performance.now();acc=0;});}catch(e){}}

 get exitLever(){return exitLever;},get eyeState(){return eyeState;},get T(){return T;},get cpi(){return cpi;},set cpi(v){cpi=v;},get deaths(){return deaths;},get ending(){return ending;},get mode(){return mode;},set mode(v){mode=v;},get camX(){return camX;},get WORLD(){return WORLD;},get lvI(){return lvI;}};
